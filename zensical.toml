[project]
site_name = "idfkit-docs"
site_url = "https://docs.idfkit.com"
site_description = "Comprehensive EnergyPlus documentation — Input/Output Reference, Engineering Reference, and more. Searchable, hyperlinked, and covering all versions."
site_author = "Samuel Letellier-Duchesne"
copyright = "An idfkit project. MIT License."
repo_url = "https://github.com/idfkit/idfkit-docs"

[project.plugins.meta]
# Enables per-page meta description from YAML front matter

[project.plugins.tags]
# Enables tag-based navigation and filtering

[project.theme]
variant = "modern"
features = [
    "navigation.tabs",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "navigation.tracking",
    "content.code.copy",
    "toc.follow",
]

# Fonts are self-hosted by the identity derivation (identity/material/fonts.css), so the theme loads
# none from Google Fonts.
font = false

# The palette is identity/material/palette.yml transcribed to TOML: both schemes are custom and read
# their colours from identity/material/material.css, which the generator appends to extra_css.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"
