# Rehearse this repository against an unpublished idfkit, before it is released (feature 004, US2).
#
# A maintainer names a commit, branch or tag in idfkit/idfkit or idfkit/idfkit-js. For python, the
# reusable workflow builds a wheel, installs it over this repository's synced environment without
# touching pyproject.toml or uv.lock, and type-checks the scripts that import idfkit with pyright. For
# javascript, it packs the candidate's packages and type-checks idf-editor/ against them. This
# repository has no test suite, so in both cases the type check is the whole rehearsal.
#
# The commands it runs are not written here. They are this repository's rehearsal entry in
# governance/consumers.toml in idfkit-conformance, read at the pinned tag below.
#
# Dispatch only. A failure the candidate causes is a finding against idfkit, and it never blocks a
# pull request here.

name: rehearse-candidate

on:
  workflow_dispatch:
    inputs:
      # Both libraries' rehearse-all.yml dispatch every consumer with `-f library=...`. This
      # repository resolves python in scripts/ and javascript in idf-editor/.
      library:
        description: The library to rehearse.
        required: true
        type: choice
        options: [python, javascript]
        default: python
      candidate_ref:
        description: A commit, branch or tag in idfkit/idfkit (python) or idfkit/idfkit-js (javascript). Required.
        required: true
        type: string

permissions:
  contents: read

jobs:
  rehearse:
    uses: idfkit/idfkit-conformance/.github/workflows/rehearse.yml@governance-2026.18
    with:
      governance_level: governance-2026.18
      consumer: idfkit-docs
      library: ${{ inputs.library }}
      candidate_ref: ${{ inputs.candidate_ref }}
